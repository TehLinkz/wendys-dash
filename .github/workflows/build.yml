name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build, verify, and package
        shell: powershell
        run: .\build.ps1 -Test -Package
      - name: Upload portable release
        uses: actions/upload-artifact@v7.0.2
        with:
          name: WendysDash-windows
          path: artifacts/WendysDash-1.0.0-win.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish v1.0.0 if it does not exist
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v1.0.0 --json id *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'v1.0.0 already exists; published files are left unchanged.'
            exit 0
          }
          gh release create v1.0.0 `
            artifacts/WendyQuestDashPatcher.exe `
            artifacts/WendysDash-1.0.0-win.zip `
            artifacts/WendysDash-1.0.0-win/SHA256SUMS.txt `
            --target $env:GITHUB_SHA `
            --title "Wendy's Dash v1.0.0" `
            --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
