name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build, verify, and package
        shell: powershell
        run: .\build.ps1 -Test -Package
      - name: Upload Windows files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: WendysDash-windows
          path: |
            artifacts/WendyQuestDashPatcher.exe
            artifacts/WendysDash-1.0.0-win.zip
          if-no-files-found: error
          retention-days: 30

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify the Linux script
        run: |
          bash -n linux/WendysDash.sh
          python3 linux/test_script.py
      - name: Package the Linux script
        run: |
          mkdir -p artifacts/WendysDash-1.1.0-linux
          cp linux/WendysDash.sh artifacts/WendysDash.sh
          cp linux/WendysDash.sh LICENSE docs/STEAM_DECK.md artifacts/WendysDash-1.1.0-linux/
          chmod +x artifacts/WendysDash.sh artifacts/WendysDash-1.1.0-linux/WendysDash.sh
          tar -C artifacts -czf artifacts/WendysDash-1.1.0-linux.tar.gz WendysDash-1.1.0-linux
          cd artifacts
          sha256sum WendysDash.sh WendysDash-1.1.0-linux.tar.gz > SHA256SUMS-linux.txt
      - name: Upload Linux script and package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: WendysDash-linux
          path: |
            artifacts/WendysDash.sh
            artifacts/WendysDash-1.1.0-linux.tar.gz
            artifacts/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 30
