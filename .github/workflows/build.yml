name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build, verify, and package
        shell: powershell
        run: .\build.ps1 -Test -Package
      - name: Upload Windows files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: WendysDash-windows
          path: |
            artifacts/WendyQuestDashPatcher.exe
            artifacts/WendysDash-1.0.0-win.zip
          if-no-files-found: error
          retention-days: 30

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Install GUI test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libx11-6 libice6 libsm6 libfontconfig1
      - name: Build, test, and package Linux
        run: bash linux/package.sh
      - name: Upload Linux package and GUI preview
        uses: actions/upload-artifact@v7.0.2
        with:
          name: WendysDash-linux-x64
          path: |
            artifacts/WendysDash-1.1.0-linux-x64.tar.gz
            artifacts/SHA256SUMS-linux.txt
            artifacts/linux-gui.png
          if-no-files-found: error
          retention-days: 30
